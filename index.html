<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEST Scan</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://unpkg.com/@zxing/browser@latest"></script>
</head>

<body>

<header>
    <h1>BEST Scan</h1>
</header>

<main>

    <div class="button-area">
        <button id="startBtn">
            📷 スキャン開始
        </button>

        <button id="stopBtn">
            ■ 停止
        </button>
    </div>

    <div id="reader"></div>

    <div class="result">

        <h2>読み取り結果</h2>

        <p><strong>JAN</strong></p>
        <div id="jan">---</div>

        <p><strong>メーカー</strong></p>
        <div id="maker">---</div>

        <p><strong>商品名</strong></p>
        <div id="name">---</div>

        <button id="saveBtn">
            Googleスプレッドシートへ保存
        </button>

        <div id="message"></div>

    </div>

</main>

<script src="app.js"></script>

</body>
</html>
